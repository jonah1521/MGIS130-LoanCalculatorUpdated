<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Calculator - MGIS130</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Simple Loan Calculator</h1>
      <p class="subtitle">Demonstrating Three-Layer Information Systems Architecture</p>
    </header>

    <main class="card">
      <form id="loan-form">
        <div class="form-group">
          <label for="amount">Loan Amount ($):</label>
          <input type="number" id="amount" placeholder="e.g. 10000" min="1" step="any" required>
        </div>

        <div class="form-group">
          <label for="interest">Annual Interest Rate (%):</label>
          <input type="number" id="interest" placeholder="e.g. 5.5" min="0.1" step="0.1" required>
        </div>

        <div class="form-group">
          <label for="years">Loan Term (Years):</label>
          <input type="number" id="years" placeholder="e.g. 5" min="1" max="30" required>
        </div>

        <button type="submit" id="calculate-btn">Calculate Payment</button>
      </form>

      <div id="error-message" class="error-box hidden"></div>

      <section id="results" class="results-box hidden">
        <h2>Payment Summary</h2>
        <div class="result-item">
          <span>Monthly Payment:</span>
          <strong id="monthly-payment">$0.00</strong>
        </div>
        <div class="result-item">
          <span>Total Principal:</span>
          <span id="total-principal">$0.00</span>
        </div>
        <div class="result-item">
          <span>Total Interest:</span>
          <span id="total-interest">$0.00</span>
        </div>
        <div class="result-item">
          <span>Total Repayment:</span>
          <span id="total-payment">$0.00</span>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
